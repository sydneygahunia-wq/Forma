# Full production-like stack:
#   postgres  - source of truth (orders, inventory)
#   redis     - pub/sub between the simulation worker and the API
#   api       - FastAPI (REST + WebSocket); does NOT run the simulation
#   worker    - runs the simulation loop (SIM_MODE=external)
#   web       - Next.js storefront + dashboard
#
#   docker compose up --build      then open http://localhost:3000

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://forma:forma@postgres:5432/forma
  REDIS_URL: redis://redis:6379/0
  SIM_MODE: external
  LOG_LEVEL: INFO

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: forma
      POSTGRES_DB: forma
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      <<: *backend-env
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      # Let the API own migrations and seeding; the worker waits for it.
      AUTO_MIGRATE: "false"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
