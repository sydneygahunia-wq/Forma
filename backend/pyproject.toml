[project]
name = "forma-backend"
version = "0.1.0"
description = "Forma: autonomous fulfillment simulator (API + simulation engine)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "email-validator>=2.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "httpx2>=2.14", "ruff>=0.6", "mypy>=1.10", "fakeredis>=2.26"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs a real PostgreSQL server (set TEST_DATABASE_URL)"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
